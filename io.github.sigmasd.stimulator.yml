app-id: io.github.sigmasd.stimulator

runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk

command: stimulator

finish-args:
  # display
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # gtk4 wants to access gpu
  - --device=dri
  # tray/status icon
  - --talk-name=org.kde.StatusNotifierWatcher
  # disable screensaver
  - --talk-name=org.freedesktop.ScreenSaver

modules:
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  - name: stimulator
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin/runtime
      - cp deno /app/bin/deno
      - cp -r src /app/bin/runtime/src
      - |
        sed -i 's/"vendor": false/"vendor": true/' deno.jsonc
      - cp deno.jsonc /app/bin/runtime/deno.jsonc
      - cp deno.lock /app/bin/runtime/deno.lock
      - cp -r vendor /app/bin/runtime/vendor

      - mv stimulator /app/bin/stimulator

      # check that it builds correctly
      - cd /app/bin/runtime && /app/bin/deno check --unstable-raw-imports

      - install -Dm644 distro/io.github.sigmasd.stimulator.desktop -t /app/share/applications/
      - install -Dm644 distro/io.github.sigmasd.stimulator.svg -t /app/share/icons/hicolor/scalable/apps/
      - install -Dm644 distro/io.github.sigmasd.stimulator-inactive.svg -t /app/share/icons/hicolor/scalable/apps/
      - install -Dm644 distro/io.github.sigmasd.stimulator-tray.svg -t /app/share/icons/hicolor/scalable/apps/
      - install -Dm644 distro/io.github.sigmasd.stimulator.metainfo.xml -t /app/share/metainfo/

    sources:
      # deno
      - type: archive
        url: https://github.com/denoland/deno/releases/download/v2.9.3/deno-x86_64-unknown-linux-gnu.zip
        sha256: 8101865641cbede56f08ad19c0a67a87df84bce127fee0d3e3e1f7467717ffa6
        only-arches:
          - x86_64
      - type: archive
        url: https://github.com/denoland/deno/releases/download/v2.9.3/deno-aarch64-unknown-linux-gnu.zip
        sha256: 753937db98a4b56cbbbd26e8f00eb4b789191a229afec93f74bcfa4e79bc2c8b
        only-arches:
          - aarch64

      # stimulator
      - type: archive
        url: https://github.com/sigmaSd/stimulator/archive/refs/tags/2.0.1.tar.gz
        sha256: 57f73f6e1eeb63df149a149a46dca98753342c5ad8a9a642bc33dfac5c40bc50

      - type: script
        dest-filename: stimulator
        commands:
          - |
            PYTHON_SO=$(find /usr/lib/$(uname -m)-linux-gnu -name 'libpython3*.so.1*' | head -1)
            DENO_PYTHON_PATH=$PYTHON_SO /app/bin/deno run --cached-only --allow-all --unstable-raw-imports /app/bin/runtime/src/main.ts

      - deno-sources.json
